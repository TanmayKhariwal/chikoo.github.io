<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Chikoo | My Forever Love</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --pink: #ffb7c5;
            --purple: #dcd3ff;
            --cream: #fffaf0;
            --gold: #d4af37;
            --text: #5d4e60;
            --parchment: #fdf5e6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: var(--cream); 
            color: var(--text); 
            overflow-x: hidden; 
            scroll-behavior: smooth;
        }
        h1, h2, h3 { font-family: 'Dancing Script', cursive; color: var(--gold); }

        /* Background Heart Animation */
        #bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .heart { position: absolute; color: var(--pink); opacity: 0.5; animation: float 6s linear infinite; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

        /* Layout */
        section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
        .hidden { display: none !important; }
        .container { 
            max-width: 800px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px); 
            padding: 40px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Navigation Buttons */
        .nav-group { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .btn { 
            background: white; 
            border: 2px solid var(--pink); 
            padding: 12px 25px; 
            border-radius: 50px; 
            color: var(--text); 
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: 500; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { background: var(--pink); color: white; transform: translateY(-2px); }
        .btn-back { border-color: var(--purple); }
        .btn-back:hover { background: var(--purple); color: var(--text); }

        /* Counter Styling */
        .counter-box { background: white; margin: 20px auto; padding: 25px; border-radius: 25px; border: 1px solid var(--purple); width: 100%; max-width: 550px; }
        .time-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px; 
            margin-bottom: 20px; 
            align-items: center;
        }
        .time-unit { display: flex; flex-direction: column; align-items: center; }
        .time-unit span:first-child { font-size: 1.6rem; font-weight: bold; color: var(--text); }
        .time-unit span:last-child { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; }
        
        .toggle-container { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
        .mini-btn { font-size: 0.7rem; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--purple); background: white; cursor: pointer; transition: 0.2s; }
        .mini-btn.active { background: var(--purple); color: white; }

        /* Love Letter Parchment */
        .parchment { 
            background-color: var(--parchment); 
            padding: 40px; 
            border-radius: 8px; 
            text-align: left; 
            font-family: 'Dancing Script', cursive; 
            font-size: 1.6rem; 
            line-height: 1.8; 
            max-height: 450px; 
            overflow-y: auto; 
            border: 1px solid #e0d5c1; 
            box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
        }

        /* Reasons List */
        .reasons-container { text-align: left; }
        .reason-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; font-size: 1.1rem; }
        .reason-item i { color: var(--pink); font-size: 1.2rem; }

        @media (max-width: 600px) {
            h1 { font-size: 2.8rem !important; }
            .container { padding: 20px; }
            .time-grid { gap: 5px; }
            .time-unit span:first-child { font-size: 1.2rem; }
            .parchment { font-size: 1.3rem; padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="bg-animation"></div>

    <!-- Page 0: Home -->
    <section id="page-0">
        <div class="container" style="background:none; border:none; box-shadow:none;">
            <h1 style="font-size: 4.5rem; margin-bottom: 15px;">Chikoo, My Forever Love.</h1>
            <p style="font-size: 1.4rem; font-style: italic;">Every heartbeat of mine spells your name.</
